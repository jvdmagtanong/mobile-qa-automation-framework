name: Mobile Automation Tests

on:
  workflow_dispatch:

jobs:
  mobile-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Python environment
        run: |
          python --version
          pip --version
          pytest --version

      - name: Start Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -no-metrics
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            echo "Android emulator information:"
            adb devices

            echo "Android version:"
            adb shell getprop ro.build.version.release

            echo "Android API level:"
            adb shell getprop ro.build.version.sdk

            echo "CPU architecture:"
            adb shell getprop ro.product.cpu.abi

            echo "Page size:"
            adb shell getconf PAGESIZE