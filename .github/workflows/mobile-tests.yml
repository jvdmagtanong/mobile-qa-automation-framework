name: Mobile Automation Tests

on:
  workflow_dispatch:

env:
  APK_URL: https://github.com/saucelabs/my-demo-app-android/releases/download/2.2.0/mda-2.2.0-25.apk
  APK_PATH: apps/mda-2.2.0-25.apk
  USERNAME: ${{ vars.USERNAME }}
  PASSWORD: ${{ secrets.PASSWORD }}

jobs:
  mobile-tests:
    runs-on: ubuntu-latest
    environment: mobile-test-automation

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Python environment
        run: |
          python --version
          pip --version
          pytest --version

      - name: Download application
        run: |
          mkdir -p apps
          curl -L -o "$APK_PATH" "$APK_URL"

      - name: Verify application
        run: |
          ls -lh "$APK_PATH"
          file "$APK_PATH"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Start Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -no-metrics -no-snapshot-load -no-snapshot-save
          emulator-boot-timeout: 900
          script: |
            echo "===== Emulator health check ====="
            adb devices

            echo "Android version:"
            adb shell getprop ro.build.version.release

            echo "Android API level:"
            adb shell getprop ro.build.version.sdk

            echo "CPU architecture:"
            adb shell getprop ro.product.cpu.abi

            echo "Boot completed:"
            adb shell getprop sys.boot_completed

            echo "Android settings service:"
            adb shell settings get global window_animation_scale

            echo "Package manager:"
            adb shell pm list packages | head -20

            echo "===== Emulator health check passed ====="

            echo "Installing Appium..."
            npm install -g appium@3

            echo "Appium version:"
            appium --version

            echo "Installing UiAutomator2 driver..."
            appium driver install uiautomator2

            echo "===== Finding Appium helper APKs ====="
            find "$HOME/.appium" -type f -name "*.apk" -print

            echo "Installed Appium drivers:"
            appium driver list --installed

            echo "Starting Appium server..."
            appium --address 127.0.0.1 --port 4723 --log-level debug > /tmp/appium.log 2>&1 &

            echo "Waiting for Appium server..."
            sleep 5

            echo "Checking Appium server..."
            curl -sf "http://127.0.0.1:4723/status"
            echo "Appium server is ready."

            echo "===== Disabling APK verification ====="
            adb shell settings put global package_verifier_enable 0
            adb shell settings put global verifier_verify_adb_installs 0

            echo "Package verifier settings:"
            adb shell settings get global package_verifier_enable
            adb shell settings get global verifier_verify_adb_installs

            echo "===== Verifying Package Manager before APK installation ====="

            adb shell pm path com.android.settings

            echo "Package Manager is responding."

            echo "===== Installing test APK manually ====="
            adb install -r --no-incremental "$APK_PATH"

            echo "===== Checking installed package ====="
            adb shell pm list packages | grep saucelabs

            echo "===== Inspecting UiAutomator2 installation ====="

            echo "Appium home:"
            echo "$HOME/.appium"

            echo "Installed drivers:"
            appium driver list --installed

            echo "===== Installing Appium Settings APK ====="

            echo "Settings APK:"
            ls -lh /home/runner/.appium/node_modules/appium-uiautomator2-driver/node_modules/io.appium.settings/apks/settings_apk-debug.apk

            echo "Installing Settings APK:"
            adb install -r --no-incremental /home/runner/.appium/node_modules/appium-uiautomator2-driver/node_modules/io.appium.settings/apks/settings_apk-debug.apk

            echo "Checking Appium Settings package:"
            adb shell pm list packages | grep io.appium.settings

            echo "Checking Appium Settings APK path:"
            adb shell pm path io.appium.settings

            echo "===== Starting Appium Settings manually ====="

            adb shell am force-stop io.appium.settings || true
            adb shell monkey -p io.appium.settings 1 || true

            sleep 5

            echo "===== Appium Settings process ====="
            adb shell pidof io.appium.settings || echo "Appium Settings is NOT running"

            echo "===== Appium Settings package information ====="
            adb shell dumpsys package io.appium.settings | head -100

            echo "===== Recent Appium Settings errors ====="
            adb logcat -d -t 500 | grep -i -E "io.appium.settings|AndroidRuntime|FATAL EXCEPTION|SecurityException" || true

            echo "===== Running mobile tests ====="
            pytest tests/mobile/authentication/test_login_successful.py -v
            TEST_EXIT_CODE=$?

            echo "===== Appium log ====="
            cat /tmp/appium.log

            echo "===== End diagnostics ====="

            exit $TEST_EXIT_CODE