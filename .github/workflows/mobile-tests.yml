name: Mobile Automation Tests

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  APK_URL: https://github.com/saucelabs/my-demo-app-android/releases/download/2.2.0/mda-2.2.0-25.apk
  APK_PATH: apps/mda-2.2.0-25.apk
  USERNAME: ${{ vars.USERNAME }}
  PASSWORD: ${{ secrets.PASSWORD }}

jobs:
  mobile-tests:
    runs-on: macos-14
    environment: 
      name: mobile-test-automation
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Python environment
        run: |
          python --version
          pip --version
          pytest --version

      - name: Download application
        run: |
          mkdir -p apps
          curl -L -o "$APK_PATH" "$APK_URL"

      - name: Verify application
        run: |
          ls -lh "$APK_PATH"
          file "$APK_PATH"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Start Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: arm64-v8a
          profile: pixel_7
          ram-size: 4096M
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -camera-back none -camera-front none
          emulator-boot-timeout: 900
          script: |
            echo "===== Emulator started successfully ====="

            echo "ADB devices:"
            adb devices

            echo "Android version:"
            adb shell getprop ro.build.version.release

            echo "API level:"
            adb shell getprop ro.build.version.sdk

            echo "Architecture:"
            adb shell getprop ro.product.cpu.abi

            echo "Boot completed:"
            adb shell getprop sys.boot_completed

            echo "Page size:"
            adb shell getconf PAGE_SIZE

            echo "Package Manager:"
            adb shell service check package

            echo "Activity Manager:"
            adb shell service check activity

            echo "Settings:"
            adb shell service check settings

            echo "===== Installing Appium ====="
            npm install -g appium@3

            echo "Appium version:"
            appium --version

            echo "===== Installing UiAutomator2 ====="
            appium driver install uiautomator2

            echo "===== Starting Appium ====="
            appium --address 127.0.0.1 --port 4723 --log-level debug > /tmp/appium.log 2>&1 &

            sleep 5

            curl -sf "http://127.0.0.1:4723/status"

            echo "===== Installing application ====="
            adb install -r --no-incremental "$APK_PATH"

            echo "===== Running test ====="
            pytest tests/mobile/authentication/test_login_successful.py -v --alluredir=test-reports/allure-results || true

            echo "===== Appium log ====="
            cat /tmp/appium.log || true
      
      - name: Install Allure
        if: always()
        run: |
          npm install -g allure-commandline
          allure --version

      - name: Generate Allure HTML report
        if: always()
        run: |
          echo "===== Generating Allure HTML report ====="
          allure generate test-reports/allure-results --clean -o test-reports/allure-report
          echo "===== Allure report generated ====="
          find test-reports/allure-report -maxdepth 2 -type f | head -30
      
      - name: Setup Pages
        if: always()
        uses: actions/configure-pages@v5

      - name: Upload Allure report to Pages
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: test-reports/allure-report

      - name: Deploy to GitHub Pages
        if: always()
        id: deployment
        uses: actions/deploy-pages@v4
