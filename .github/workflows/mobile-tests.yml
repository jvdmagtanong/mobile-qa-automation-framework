name: Mobile Automation Tests

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  APK_URL: https://github.com/saucelabs/my-demo-app-android/releases/download/2.2.0/mda-2.2.0-25.apk
  APK_PATH: apps/mda-2.2.0-25.apk
  USERNAME: ${{ vars.USERNAME }}
  PASSWORD: ${{ secrets.PASSWORD }}
  DEVICE_NAME: pixel_4
  DEVICE_UDID: emulator-5554
  APPIUM_HOST: 127.0.0.1
  APPIUM_PORT: 4723

jobs:
  mobile-tests:
    runs-on: ubuntu-latest
    environment: 
      name: mobile-test-automation
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Python environment
        run: |
          python --version
          pip --version
          pytest --version

      - name: Download application
        run: |
          mkdir -p apps
          curl -L -o "$APK_PATH" "$APK_URL"

      - name: Verify application
        run: |
          ls -lh "$APK_PATH"
          file "$APK_PATH"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run Android Emulator and Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86
          profile: pixel_4
          cores: 4
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -camera-back none
          script: bash scripts/workflow_run_tests.sh

      - name: Upload Android Diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-diagnostics
          path: |
            test-reports/accessibility.txt
            test-reports/ui-errors.txt
            test-reports/logcat.txt
            test-reports/memory.log
            test-reports/appium.log
          if-no-files-found: warn
      
      - name: Install Allure
        if: always()
        run: |
          npm install -g allure-commandline
          allure --version

      - name: Generate Allure HTML report
        if: always()
        run: |
          echo "===== Generating Allure HTML report ====="
          allure generate test-reports/allure-results --clean -o test-reports/allure-report
          echo "===== Allure report generated ====="
          find test-reports/allure-report -maxdepth 2 -type f | head -30
      
      - name: Setup Pages
        if: always()
        uses: actions/configure-pages@v5

      - name: Upload Allure report to Pages
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: test-reports/allure-report

      - name: Deploy to GitHub Pages
        if: always()
        id: deployment
        uses: actions/deploy-pages@v4
