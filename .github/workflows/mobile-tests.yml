name: Mobile Automation Tests

on:
  workflow_dispatch:

env:
  APK_URL: https://github.com/saucelabs/my-demo-app-android/releases/download/2.2.0/mda-2.2.0-25.apk
  APK_PATH: apps/mda-2.2.0-25.apk

jobs:
  mobile-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Python environment
        run: |
          python --version
          pip --version
          pytest --version

      - name: Download application
        run: |
          mkdir -p apps
          curl -L -o "$APK_PATH" "$APK_URL"

      - name: Verify application
        run: |
          ls -lh "$APK_PATH"
          file "$APK_PATH"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Start Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -no-metrics
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            echo "Android emulator information:"
            adb devices

            echo "Android version:"
            adb shell getprop ro.build.version.release

            echo "Android API level:"
            adb shell getprop ro.build.version.sdk

            echo "CPU architecture:"
            adb shell getprop ro.product.cpu.abi

            echo "Page size:"
            adb shell getconf PAGESIZE

            echo "Installing Appium..."

            npm install -g appium@3

            echo "Appium version:"
            appium --version

            echo "Installing UiAutomator2 driver..."

            appium driver install uiautomator2

            echo "Installed Appium drivers:"
            appium driver list --installed

            echo "Starting Appium server..."

            appium --address 127.0.0.1 --port 4723 > /tmp/appium.log 2>&1 &

            echo "Waiting for Appium server..."

            sleep 5

            echo "Checking Appium server..."

            curl -sf "http://127.0.0.1:4723/status"

            echo "Appium server is ready."

            echo "Starting Appium server..."

            appium --address 127.0.0.1 --port 4723 > /tmp/appium.log 2>&1 &

            echo "Waiting for Appium server..."

            sleep 5

            echo "Checking Appium server..."

            curl -sf "http://127.0.0.1:4723/status"

            echo "Appium server is ready."

            echo "Running mobile tests..."

            pytest tests/mobile/test_login.py -v

