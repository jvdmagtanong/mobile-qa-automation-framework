name: Mobile Automation Tests

on:
  workflow_dispatch:

env:
  APK_URL: https://github.com/saucelabs/my-demo-app-android/releases/download/2.2.0/mda-2.2.0-25.apk
  APK_PATH: apps/mda-2.2.0-25.apk
  USERNAME: ${{ vars.USERNAME }}
  PASSWORD: ${{ secrets.PASSWORD }}

jobs:
  mobile-tests:
    runs-on: ubuntu-latest
    environment: mobile-test-automation

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Python environment
        run: |
          python --version
          pip --version
          pytest --version

      - name: Download application
        run: |
          mkdir -p apps
          curl -L -o "$APK_PATH" "$APK_URL"

      - name: Verify application
        run: |
          ls -lh "$APK_PATH"
          file "$APK_PATH"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Start Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -no-metrics -no-snapshot-load -no-snapshot-save
          emulator-boot-timeout: 900
          script: |
            echo "===== Emulator health check ====="

            echo "ADB devices:"
            adb devices

            echo "Android version:"
            adb shell getprop ro.build.version.release

            echo "Android API level:"
            adb shell getprop ro.build.version.sdk

            echo "CPU architecture:"
            adb shell getprop ro.product.cpu.abi

            echo "Boot completed:"
            adb shell getprop sys.boot_completed

            echo "===== Verifying Android system services ====="

            echo "Package service:"
            adb shell service check package

            echo "Activity service:"
            adb shell service check activity

            echo "Settings service:"
            adb shell service check settings

            echo "===== Verifying Package Manager ====="

            adb shell pm path com.android.settings

            echo "===== Verifying Activity Manager ====="

            adb shell am get-current-user

            echo "===== Verifying Settings ====="

            adb shell settings get global window_animation_scale

            echo "===== Android system services are healthy ====="