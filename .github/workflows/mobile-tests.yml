name: Mobile Automation Tests

on:
  workflow_dispatch:

env:
  APK_URL: https://github.com/saucelabs/my-demo-app-android/releases/download/2.2.0/mda-2.2.0-25.apk
  APK_PATH: apps/mda-2.2.0-25.apk
  USERNAME: ${{ vars.USERNAME }}
  PASSWORD: ${{ secrets.PASSWORD }}

jobs:
  mobile-tests:
    runs-on: ubuntu-latest
    environment: mobile-test-automation

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Python environment
        run: |
          python --version
          pip --version
          pytest --version

      - name: Download application
        run: |
          mkdir -p apps
          curl -L -o "$APK_PATH" "$APK_URL"

      - name: Verify application
        run: |
          ls -lh "$APK_PATH"
          file "$APK_PATH"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Start Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M 
          heap-size: 512M
          disable-animations: false
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -no-metrics
          emulator-boot-timeout: 900
          script: |
            until adb shell pm path android > /dev/null 2>&1; do echo "Waiting for Package Manager..."; sleep 3; done

            adb shell input keyevent 66 # Press Enter/OK on active dialogs

            echo "===== Verifying Page Size ====="
            adb shell getconf PAGE_SIZE

            echo "===== Disabling Animations Safely ====="
            adb shell settings put global window_animation_scale 0.0
            adb shell settings put global transition_animation_scale 0.0
            adb shell settings put global animator_duration_scale 0.0

            echo "===== Installing Appium ====="
            npm install -g appium@3

            echo "Appium version:"
            appium --version

            echo "===== Installing UiAutomator2 driver ====="
            appium driver install uiautomator2

            echo "===== Installed Appium drivers ====="
            appium driver list --installed

            echo "===== Starting Appium server ====="
            appium --address 127.0.0.1 --port 4723 --log-level debug > /tmp/appium.log 2>&1 &

            echo "Waiting for Appium server..."
            sleep 5

            echo "Checking Appium server..."
            curl -sf "http://127.0.0.1:4723/status"
            echo "Appium server is ready."

            echo "===== Installing test APK ====="
            adb install -r --no-incremental "$APK_PATH"

            echo "===== Verifying test APK ====="
            adb shell pm list packages | grep saucelabs

            echo "===== Running mobile test ====="
            pytest tests/mobile/authentication/test_login_successful.py -v --alluredir=test-reports/allure-results

            TEST_EXIT_CODE=$?

            echo "===== Test exit code: $TEST_EXIT_CODE ====="

            echo "===== Screenshots ====="
            find test-reports/screenshots -type f -print 2>/dev/null || true

            echo "===== Allure results ====="
            find test-reports/allure-results -type f -print 2>/dev/null || true

            echo "===== Appium log ====="
            cat /tmp/appium.log || true

            echo "===== End diagnostics ====="

            exit $TEST_EXIT_CODE
      
      - name: Install Allure
        if: always()
        run: |
          npm install -g allure-commandline
          allure --version

      - name: Generate Allure HTML report
        if: always()
        run: |
          echo "===== Generating Allure HTML report ====="
          allure generate test-reports/allure-results --clean -o test-reports/allure-report
          echo "===== Allure report generated ====="
          find test-reports/allure-report -maxdepth 2 -type f | head -30

      - name: Upload Allure HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-html-report
          path: test-reports/allure-report
          if-no-files-found: warn

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-test-screenshots
          path: test-reports/screenshots
          if-no-files-found: warn
