name: Mobile Automation Tests

on:
  workflow_dispatch:

jobs:
  mobile-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Python environment
        run: |
          python --version
          pip --version
          pytest --version

      - name: Start Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            echo "Android emulator information:"
            adb devices

            echo "Android version:"
            adb shell getprop ro.build.version.release

            echo "Android API level:"
            adb shell getprop ro.build.version.sdk

            echo "CPU architecture:"
            adb shell getprop ro.product.cpu.abi

            echo "Page size:"
            adb shell getconf PAGESIZE

            PAGE_SIZE=$(adb shell getconf PAGESIZE | tr -d '\r')

            if [ "$PAGE_SIZE" != "4096" ]; then
              echo "ERROR: This emulator is using ${PAGE_SIZE}-byte pages."
              echo "The application requires a 4 KB page-size emulator."
              exit 1
            fi

            echo "4 KB page-size requirement verified."